<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <style>
    .navbarItem {
      color: white;
      text-decoration: none;
      cursor: pointer;
      text-align: center;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .navbarItem:hover {
      opacity: 0.7;
      color: white;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      left: 50%;
      transform: translate(-50%, 0%);
      background-color: white;
      box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
      z-index: 1;
      border-radius: 10px;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .arabic {
      font-family: "Almarai";
    }

    .english {
      font-family: "Outfit";
    }
  </style>
  <nav id="navBar" class="navbar navbar-dark navbar-expand-md fixed-top m-0 w-100 shadow-lg"
    style="z-index: 999; background-color: rgba(0, 0, 0, 0.5);  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);">
    <button class="navbar-toggler border-0    shadow-none " data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <a class="text-decoration-none text-white" href="index.html">
    <img class="d-block position-absolute d-md-none" draggable="false" src="logo.svg" style="object-fit:contain; width: 110px; min-width: 110px;
        left: 50%; top: 14px ; transform: translateX(-50%);
        " /></a>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <div class="row  justify-content-center mx-auto w-100 my-2 ">
        <div class="col-lg-9 d-flex flex-column flex-sm-row justify-content-around">
          <div div class="d-none d-md-block">
            <a class="text-decoration-none text-white" href="Ajna Landing Page.html">
            <img class="my-auto" draggable="false" src="logo.svg" style="height: 100%; object-fit:contain;" />
          </a>
          </div>
          <a class="navbarItem my-sm-1 "  onclick="location.href='solutions.html'">Solutions</a>
          <a class="navbarItem my-sm-1" href="">Clients</a>
          <a class="navbarItem my-sm-1" href="">Insights</a>
          <a class="navbarItem my-sm-1" href="">Contact</a>
          <button class="navbarItem bg-transparent text-center text-white  border-0 ">
            <i class="fa fa-search text-center my-sm-1"></i>
          </button>
          <div class="dropdown my-auto d-inline-block position-relative text-white text-center ">
            <b class="navbarItem my-sm-1 ">EN</b>
            <div class="dropdown-content p-2 ">
              <div style="position:absolute;left: 50%; top: 0%;  transform: translate(-50%, -50%); 
              width: 0; height: 0; border-left: 10px solid transparent;border-right: 
              10px solid transparent; border-bottom: 10px solid white"></div>
              <div class="d-flex align-items-center">
                <input class="mx-1" type="radio" id="arabic" name="language" value="arabic"
                  onclick="changeLanguage('arabic')">
                <label class="arabic text-black mx-2" for="arabic">العربية</label>
              </div>
              <div class="d-flex align-items-center">
                <input class="mx-1" type="radio" id="english" name="language" value="english"
                  onclick="changeLanguage('english')">
                <label class="english text-black mx-2" for="english">English</label>
              </div>
            </div>
          </div>
          <button class="bg-transparent text-white fw-bold border-0 my-sm-1">LOGIN</button>
          <button class="text-white border-0 fw-bold px-2 my-sm-1 rounded-3"
            style="background-image: linear-gradient(to right, #516bfc, #72b7f8);">INQUIRE NOW</button>
        </div>
      </div>
    </div>
  </nav>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.2/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);
    const showAnim = gsap.from('.navbar', {
      yPercent: -100,
      paused: true,
      duration: 0.2
    }).progress(1);
    ScrollTrigger.create({
      start: "top top",
      end: 99999,
      onUpdate: (self) => {
        self.direction === -1 ? showAnim.play() : showAnim.reverse()
      }
    });


    if (location.hash == '')
      location.hash = 'english';

    function changeLanguage(lang) {
      location.hash = lang;
      location.reload();
    }

    if (window.location.hash) {
      if (window.location.hash == "#english") {
        document.getElementById('english').checked = true;
        document.body.style.fontFamily = '"Outfit", sans-serif';
        document.body.dir = "ltr";
        document.getElementById("ltrstyleSheet").removeAttribute('disabled');
        document.getElementById("rtlstyleSheet").setAttribute('disabled', true);
        setLanguageEN();
      }
      else if (window.location.hash == "#arabic") {
        document.getElementById('arabic').checked = true;
        document.body.style.fontFamily = '"Almarai", "Outfit"';
        document.body.dir = "rtl";
        document.getElementById("rtlstyleSheet").removeAttribute('disabled');
        document.getElementById("ltrstyleSheet").setAttribute('disabled', true);
        setLanguageAR();
      }
    }

  </script>
</body>

</html>
